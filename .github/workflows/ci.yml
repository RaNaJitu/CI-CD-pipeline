name: Node CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Quality & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      artifact_name: ${{ steps.version.outputs.artifact_name }}
      app_version: ${{ steps.version.outputs.app_version }}
      git_sha: ${{ steps.version.outputs.git_sha }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: |
          mkdir -p reports
          npm audit --json > reports/npm-audit.json || true
          npm audit --audit-level=high

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: reports/npm-audit.json

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests with coverage
        run: npm test -- --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Resolve artifact version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHA="${GITHUB_SHA:0:7}"
          NAME="app-${VERSION}-${SHA}-${GITHUB_RUN_NUMBER}"
          echo "app_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "git_sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "Resolved artifact: ${NAME}"

      - name: Build application
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          GIT_SHA: ${{ steps.version.outputs.git_sha }}
          BUILD_NUMBER: ${{ github.run_number }}
          ARTIFACT_NAME: ${{ steps.version.outputs.artifact_name }}
        run: npm run build

      - name: Package application
        env:
          ARTIFACT_NAME: ${{ steps.version.outputs.artifact_name }}
        run: npm run package

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: artifacts/${{ steps.version.outputs.artifact_name }}.tar.gz
          retention-days: 14
          if-no-files-found: error

  deploy-dev:
  name: Deploy to DEV
  needs: ci
  if: github.event_name == 'push' && github.ref == 'refs/heads/main'
  runs-on: ubuntu-latest
  environment: development

  steps:
    - name: Download application artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ needs.ci.outputs.artifact_name }}
        path: artifacts

    - name: Verify artifact
      run: |
        set -euo pipefail

        TARBALL="artifacts/${{ needs.ci.outputs.artifact_name }}.tar.gz"

        echo "Artifact:"
        ls -lh "$TARBALL"

        echo "Artifact contents:"
        tar -tzf "$TARBALL" | head -30

    - name: Configure SSH
      env:
        EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      run: |
        set -euo pipefail

        mkdir -p ~/.ssh

        echo "$EC2_SSH_KEY" > ~/.ssh/ec2_key

        chmod 600 ~/.ssh/ec2_key

        ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

    - name: Verify EC2 SSH connection
      run: |
        ssh \
          -i ~/.ssh/ec2_key \
          -o IdentitiesOnly=yes \
          "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
          "echo 'SSH connection successful'; hostname; whoami"

    - name: Upload artifact to EC2
      run: |
        set -euo pipefail

        scp \
          -i ~/.ssh/ec2_key \
          -o IdentitiesOnly=yes \
          "artifacts/${{ needs.ci.outputs.artifact_name }}.tar.gz" \
          "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/cicd-learning/"

    - name: Deploy artifact on EC2
      run: |
        set -euo pipefail

        ssh \
          -i ~/.ssh/ec2_key \
          -o IdentitiesOnly=yes \
          "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
          "bash /opt/cicd-learning/deploy.sh '${{ needs.ci.outputs.artifact_name }}'"

    - name: Verify deployed application
      run: |
        ssh \
          -i ~/.ssh/ec2_key \
          -o IdentitiesOnly=yes \
          "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
          "curl --fail http://127.0.0.1:3010/api/health"
