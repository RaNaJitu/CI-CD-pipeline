name: Node CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Quality & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      artifact_name: ${{ steps.version.outputs.artifact_name }}
      app_version: ${{ steps.version.outputs.app_version }}
      git_sha: ${{ steps.version.outputs.git_sha }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: |
          mkdir -p reports
          npm audit --json > reports/npm-audit.json || true
          npm audit --audit-level=high

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: reports/npm-audit.json

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests with coverage
        run: npm test -- --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Resolve artifact version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHA="${GITHUB_SHA:0:7}"
          NAME="app-${VERSION}-${SHA}-${GITHUB_RUN_NUMBER}"
          echo "app_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "git_sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "Resolved artifact: ${NAME}"

      - name: Build application
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          GIT_SHA: ${{ steps.version.outputs.git_sha }}
          BUILD_NUMBER: ${{ github.run_number }}
          ARTIFACT_NAME: ${{ steps.version.outputs.artifact_name }}
        run: npm run build

      - name: Package application
        env:
          ARTIFACT_NAME: ${{ steps.version.outputs.artifact_name }}
        run: npm run package

      - name: Upload application artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: |
            artifacts/${{ steps.version.outputs.artifact_name }}.tar.gz
            node-app.tar.gz
          retention-days: 14

  deploy-dev:
    name: Deploy to DEV
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: development
    env:
      NODE_ENV: ${{ vars.NODE_ENV }}
      APP_ENV: development
      API_URL: ${{ vars.API_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      API_SECRET: ${{ secrets.API_SECRET }}
      PORT: 3010

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.ci.outputs.artifact_name }}
          path: artifacts/

      - name: Extract application artifact
        run: |
          set -euo pipefail
          TARBALL="artifacts/${{ needs.ci.outputs.artifact_name }}.tar.gz"
          echo "Promoting SAME CI artifact (build once, deploy many):"
          echo "  ${TARBALL}"
          ls -lh artifacts/
          rm -rf dist
          tar -xzf "${TARBALL}"
          test -f dist/build-info.json
          cat dist/build-info.json

      - name: Install production dependencies
        working-directory: dist
        run: npm ci --omit=dev

      - name: Deploy to development + health check
        run: node scripts/deploy-dev.js

      - name: Upload DEV promotion record
        uses: actions/upload-artifact@v7
        with:
          name: promotion-dev-${{ needs.ci.outputs.artifact_name }}
          path: promotions/dev.json
          retention-days: 14
