name: Node CI

on:
  push:
    branches:
      - develop
      - main
    tags:
      - "v*.*.*"

  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  ci:
    name: Quality & Build
    runs-on: ubuntu-latest
    # No environment on this job — deploy jobs use development / staging / production.
    # SonarQube Cloud is omitted for now (optional later). Quality = audit + lint + tests.

    permissions:
      contents: read
      pull-requests: write
      checks: write
    outputs:
      artifact_name: ${{ steps.version.outputs.artifact_name }}
      app_version: ${{ steps.version.outputs.app_version }}
      git_sha: ${{ steps.version.outputs.git_sha }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: |
          mkdir -p reports
          npm audit --json > reports/npm-audit.json || true
          npm audit --audit-level=high

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: reports/npm-audit.json

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests with coverage
        run: npm test -- --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Resolve artifact version
        id: version
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "Using version from tag: ${VERSION}"
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "Using version from package.json: ${VERSION}"
          fi

          SHA="${GITHUB_SHA:0:7}"
          NAME="app-${VERSION}-${SHA}-${GITHUB_RUN_NUMBER}"
          echo "app_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "git_sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "Resolved artifact: ${NAME}"

      - name: Build application
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          GIT_SHA: ${{ steps.version.outputs.git_sha }}
          BUILD_NUMBER: ${{ github.run_number }}
          ARTIFACT_NAME: ${{ steps.version.outputs.artifact_name }}
        run: npm run build

      - name: Package application
        env:
          ARTIFACT_NAME: ${{ steps.version.outputs.artifact_name }}
        run: npm run package

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: artifacts/${{ steps.version.outputs.artifact_name }}.tar.gz
          retention-days: 30
          if-no-files-found: error

  deploy-dev:
    name: Deploy to DEV
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.ci.outputs.artifact_name }}
          path: artifacts

      - name: Verify artifact
        run: |
          set -euo pipefail

          TARBALL="artifacts/${{ needs.ci.outputs.artifact_name }}.tar.gz"

          echo "Artifact:"
          ls -lh "$TARBALL"

          echo "Artifact contents:"
          tar -tzf "$TARBALL" | head -30

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail

          if [ -z "${EC2_SSH_KEY:-}" ]; then
            echo "::error::EC2_SSH_KEY is empty."
            exit 1
          fi

          if [ -z "${EC2_HOST:-}" ]; then
            echo "::error::EC2_HOST is empty."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Prefer base64-encoded private key (recommended for GitHub secrets).
          # Also accepts raw PEM / OpenSSH private key text.
          python3 <<'PY'
          import base64, os, pathlib, sys

          raw = os.environ["EC2_SSH_KEY"].strip()
          key_path = pathlib.Path.home() / ".ssh" / "ec2_key"

          def looks_like_pem(text: str) -> bool:
              return "BEGIN" in text and "PRIVATE KEY" in text

          candidates = []

          # 1) raw key (with real newlines or literal \n)
          candidates.append(raw.replace("\\n", "\n").replace("\r\n", "\n").strip() + "\n")

          # 2) base64 decode (standard recommendation for GitHub Actions)
          try:
              decoded = base64.b64decode(raw, validate=False).decode("utf-8", errors="strict")
              candidates.append(decoded.replace("\r\n", "\n").strip() + "\n")
          except Exception:
              pass

          chosen = None
          for candidate in candidates:
              if looks_like_pem(candidate):
                  chosen = candidate
                  break

          if chosen is None:
              print("::error::EC2_SSH_KEY did not contain a PRIVATE KEY block.", file=sys.stderr)
              print("Store base64 of the private key (recommended):", file=sys.stderr)
              print("  base64 -i your-key.pem | pbcopy   # macOS", file=sys.stderr)
              sys.exit(1)

          key_path.write_text(chosen)
          key_path.chmod(0o600)
          print("Private key file written.")
          PY

          if ! ssh-keygen -y -f "$HOME/.ssh/ec2_key" >/dev/null 2>&1; then
            echo "::error::Decoded EC2_SSH_KEY is still not a valid private key."
            echo "Create secret from:"
            echo "  base64 -i ~/.ssh/your-ec2-key.pem | pbcopy"
            echo "Paste that single line into Environment secret EC2_SSH_KEY."
            exit 1
          fi

          echo "SSH private key validated."
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify EC2 SSH connection
        run: |
          set -euo pipefail

          echo "=== Deploy preflight (development) ==="
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Artifact: ${{ needs.ci.outputs.artifact_name }}"
          echo "EC2_USER set: ${{ secrets.EC2_USER != '' }}"
          echo "EC2_HOST set: ${{ secrets.EC2_HOST != '' }}"
          # Host value is masked in logs if stored as a secret — still useful to confirm SSH target.

          ssh \
            -i ~/.ssh/ec2_key \
            -o IdentitiesOnly=yes \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "bash -s" <<'REMOTE'
          set -euo pipefail
          echo "SSH connection successful"
          echo "hostname=$(hostname)"
          echo "whoami=$(whoami)"
          echo "public_ip_guess=$(curl -sS --max-time 2 https://checkip.amazonaws.com || echo n/a)"
          echo "--- /opt/cicd-learning ---"
          ls -la /opt/cicd-learning || true
          echo "--- /tmp/cicd-learning ---"
          ls -la /tmp/cicd-learning || true
          echo "--- shared/.env ---"
          if [ -f /opt/cicd-learning/shared/.env ]; then
            echo "shared/.env exists"
          else
            echo "::warning::/opt/cicd-learning/shared/.env is MISSING (deploy.sh will fail linking .env)"
          fi
          echo "--- pm2 ---"
          pm2 status || true
          echo "--- port 3010 ---"
          ss -lntp | grep 3010 || echo "nothing listening on 3010"
          REMOTE

      - name: Upload artifact to EC2
        run: |
          set -euo pipefail

          scp \
            -i ~/.ssh/ec2_key \
            -o IdentitiesOnly=yes \
            "artifacts/${{ needs.ci.outputs.artifact_name }}.tar.gz" \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/cicd-learning/"

          ssh \
            -i ~/.ssh/ec2_key \
            -o IdentitiesOnly=yes \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "ls -lh '/tmp/cicd-learning/${{ needs.ci.outputs.artifact_name }}.tar.gz'"

      - name: Deploy artifact on EC2
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/ec2_key \
            -o IdentitiesOnly=yes \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "bash /opt/cicd-learning/deploy.sh '${{ needs.ci.outputs.artifact_name }}'"

      - name: Verify deployed application
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/ec2_key \
            -o IdentitiesOnly=yes \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "bash -s" <<'REMOTE'
          set -euo pipefail
          echo "--- after deploy ---"
          ls -la /opt/cicd-learning/current || true
          pm2 status || true
          curl --fail --silent http://127.0.0.1:3010/api/health
          echo
          REMOTE

  deploy-stage:
    name: Deploy to STAGE
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.ci.outputs.artifact_name }}
          path: artifacts

      - name: Verify artifact
        run: |
          set -euo pipefail

          TARBALL="artifacts/${{ needs.ci.outputs.artifact_name }}.tar.gz"

          echo "Artifact:"
          ls -lh "$TARBALL"

          echo "Artifact contents:"
          tar -tzf "$TARBALL" | head -30

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail

          if [ -z "${EC2_SSH_KEY:-}" ]; then
            echo "::error::EC2_SSH_KEY is empty (staging environment)."
            exit 1
          fi

          if [ -z "${EC2_HOST:-}" ]; then
            echo "::error::EC2_HOST is empty (staging environment)."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Prefer base64-encoded private key (recommended for GitHub secrets).
          # Also accepts raw PEM / OpenSSH private key text.
          python3 <<'PY'
          import base64, os, pathlib, sys

          raw = os.environ["EC2_SSH_KEY"].strip()
          key_path = pathlib.Path.home() / ".ssh" / "ec2_key"

          def looks_like_pem(text: str) -> bool:
              return "BEGIN" in text and "PRIVATE KEY" in text

          candidates = []

          # 1) raw key (with real newlines or literal \n)
          candidates.append(raw.replace("\\n", "\n").replace("\r\n", "\n").strip() + "\n")

          # 2) base64 decode (standard recommendation for GitHub Actions)
          try:
              decoded = base64.b64decode(raw, validate=False).decode("utf-8", errors="strict")
              candidates.append(decoded.replace("\r\n", "\n").strip() + "\n")
          except Exception:
              pass

          chosen = None
          for candidate in candidates:
              if looks_like_pem(candidate):
                  chosen = candidate
                  break

          if chosen is None:
              print("::error::EC2_SSH_KEY did not contain a PRIVATE KEY block.", file=sys.stderr)
              print("Store base64 of the private key (recommended):", file=sys.stderr)
              print("  base64 -i your-key.pem | pbcopy   # macOS", file=sys.stderr)
              sys.exit(1)

          key_path.write_text(chosen)
          key_path.chmod(0o600)
          print("Private key file written.")
          PY

          if ! ssh-keygen -y -f "$HOME/.ssh/ec2_key" >/dev/null 2>&1; then
            echo "::error::Decoded EC2_SSH_KEY is still not a valid private key."
            echo "Create secret from:"
            echo "  base64 -i ~/.ssh/your-ec2-key.pem | pbcopy"
            echo "Paste that single line into Environment secret EC2_SSH_KEY (staging)."
            exit 1
          fi

          echo "SSH private key validated."
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify EC2 SSH connection
        run: |
          set -euo pipefail

          echo "=== Deploy preflight (staging) ==="
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Artifact: ${{ needs.ci.outputs.artifact_name }}"
          echo "EC2_USER set: ${{ secrets.EC2_USER != '' }}"
          echo "EC2_HOST set: ${{ secrets.EC2_HOST != '' }}"

          ssh \
            -i ~/.ssh/ec2_key \
            -o IdentitiesOnly=yes \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "bash -s" <<'REMOTE'
          set -euo pipefail
          echo "SSH connection successful"
          echo "hostname=$(hostname)"
          echo "whoami=$(whoami)"
          echo "public_ip_guess=$(curl -sS --max-time 2 https://checkip.amazonaws.com || echo n/a)"
          echo "--- /opt/cicd-learning ---"
          ls -la /opt/cicd-learning || true
          echo "--- /tmp/cicd-learning ---"
          ls -la /tmp/cicd-learning || true
          echo "--- shared/.env ---"
          if [ -f /opt/cicd-learning/shared/.env ]; then
            echo "shared/.env exists"
          else
            echo "::warning::/opt/cicd-learning/shared/.env is MISSING (deploy.sh will fail linking .env)"
          fi
          echo "--- pm2 ---"
          pm2 status || true
          echo "--- port 3010 ---"
          ss -lntp | grep 3010 || echo "nothing listening on 3010"
          REMOTE

      - name: Upload artifact to EC2
        run: |
          set -euo pipefail

          scp \
            -i ~/.ssh/ec2_key \
            -o IdentitiesOnly=yes \
            "artifacts/${{ needs.ci.outputs.artifact_name }}.tar.gz" \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/cicd-learning/"

          ssh \
            -i ~/.ssh/ec2_key \
            -o IdentitiesOnly=yes \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "ls -lh '/tmp/cicd-learning/${{ needs.ci.outputs.artifact_name }}.tar.gz'"

      - name: Deploy artifact on EC2
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/ec2_key \
            -o IdentitiesOnly=yes \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "bash /opt/cicd-learning/deploy.sh '${{ needs.ci.outputs.artifact_name }}'"

      - name: Smoke and integration checks
        run: |
          set -euo pipefail

          ARTIFACT='${{ needs.ci.outputs.artifact_name }}'

          echo "Smoke: /api/health"
          HEALTH=$(ssh \
            -i ~/.ssh/ec2_key \
            -o IdentitiesOnly=yes \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "curl --fail --silent http://127.0.0.1:3010/api/health")
          echo "$HEALTH"

          echo "Integration: /api/pipeline"
          PIPELINE=$(ssh \
            -i ~/.ssh/ec2_key \
            -o IdentitiesOnly=yes \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "curl --fail --silent http://127.0.0.1:3010/api/pipeline")
          echo "$PIPELINE" | head -c 500
          echo

          echo "$HEALTH" | grep -q '"status"'
          echo "$PIPELINE" | grep -q .

          if echo "$HEALTH" | grep -q "$ARTIFACT"; then
            echo "Health response includes expected artifact: $ARTIFACT"
          else
            echo "::error::Health JSON did not include artifact name $ARTIFACT"
            exit 1
          fi

          echo "--- after STAGE deploy ---"
          ssh \
            -i ~/.ssh/ec2_key \
            -o IdentitiesOnly=yes \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "ls -la /opt/cicd-learning/current; pm2 status"

          echo "STAGE smoke + integration checks passed."

  deploy-prod:
    name: Deploy to PROD
    needs: ci
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.ci.outputs.artifact_name }}
          path: artifacts

      - name: Verify artifact
        run: |
          set -euo pipefail

          TARBALL="artifacts/${{ needs.ci.outputs.artifact_name }}.tar.gz"

          echo "Artifact:"
          ls -lh "$TARBALL"

          echo "Artifact contents:"
          tar -tzf "$TARBALL" | head -30

          echo "Tag: ${{ github.ref_name }}"
          echo "App version: ${{ needs.ci.outputs.app_version }}"

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail

          if [ -z "${EC2_SSH_KEY:-}" ]; then
            echo "::error::EC2_SSH_KEY is empty (production environment)."
            exit 1
          fi

          if [ -z "${EC2_HOST:-}" ]; then
            echo "::error::EC2_HOST is empty (production environment)."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          python3 <<'PYEOF'
          import base64, os, pathlib, sys

          raw = os.environ["EC2_SSH_KEY"].strip()
          key_path = pathlib.Path.home() / ".ssh" / "ec2_key"

          def looks_like_pem(text: str) -> bool:
              return "BEGIN" in text and "PRIVATE KEY" in text

          candidates = []
          candidates.append(raw.replace("\\n", "\n").replace("\r\n", "\n").strip() + "\n")
          try:
              decoded = base64.b64decode(raw, validate=False).decode("utf-8", errors="strict")
              candidates.append(decoded.replace("\r\n", "\n").strip() + "\n")
          except Exception:
              pass

          chosen = None
          for candidate in candidates:
              if looks_like_pem(candidate):
                  chosen = candidate
                  break

          if chosen is None:
              print("::error::EC2_SSH_KEY did not contain a PRIVATE KEY block.", file=sys.stderr)
              sys.exit(1)

          key_path.write_text(chosen)
          key_path.chmod(0o600)
          print("Private key file written.")
          PYEOF

          if ! ssh-keygen -y -f "$HOME/.ssh/ec2_key" >/dev/null 2>&1; then
            echo "::error::Decoded EC2_SSH_KEY is still not a valid private key."
            exit 1
          fi

          echo "SSH private key validated."
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify EC2 SSH connection
        run: |
          set -euo pipefail

          echo "=== Deploy preflight (production) ==="
          echo "Tag: ${{ github.ref_name }}"
          echo "Artifact: ${{ needs.ci.outputs.artifact_name }}"

          ssh \
            -i ~/.ssh/ec2_key \
            -o IdentitiesOnly=yes \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "bash -s" <<'REMOTE'
          set -euo pipefail
          echo "SSH connection successful"
          echo "hostname=$(hostname)"
          echo "whoami=$(whoami)"
          echo "public_ip_guess=$(curl -sS --max-time 2 https://checkip.amazonaws.com || echo n/a)"
          echo "--- /opt/cicd-learning ---"
          ls -la /opt/cicd-learning || true
          echo "--- releases ---"
          ls -la /opt/cicd-learning/releases || true
          if [ -f /opt/cicd-learning/shared/.env ]; then
            echo "shared/.env exists"
          else
            echo "::warning::/opt/cicd-learning/shared/.env is MISSING"
          fi
          if [ ! -f /opt/cicd-learning/rollback.sh ]; then
            echo "::warning::rollback.sh missing — copy scripts/rollback.sh to /opt/cicd-learning/rollback.sh"
          fi
          pm2 status || true
          REMOTE

      - name: Upload artifact to EC2
        run: |
          set -euo pipefail

          scp \
            -i ~/.ssh/ec2_key \
            -o IdentitiesOnly=yes \
            "artifacts/${{ needs.ci.outputs.artifact_name }}.tar.gz" \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/cicd-learning/"

          ssh \
            -i ~/.ssh/ec2_key \
            -o IdentitiesOnly=yes \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "ls -lh '/tmp/cicd-learning/${{ needs.ci.outputs.artifact_name }}.tar.gz'"

      - name: Deploy artifact on EC2
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/ec2_key \
            -o IdentitiesOnly=yes \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "bash /opt/cicd-learning/deploy.sh '${{ needs.ci.outputs.artifact_name }}'"

      - name: Smoke checks
        run: |
          set -euo pipefail

          ARTIFACT='${{ needs.ci.outputs.artifact_name }}'

          HEALTH=$(ssh \
            -i ~/.ssh/ec2_key \
            -o IdentitiesOnly=yes \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "curl --fail --silent http://127.0.0.1:3010/api/health")
          echo "$HEALTH"

          PIPELINE=$(ssh \
            -i ~/.ssh/ec2_key \
            -o IdentitiesOnly=yes \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "curl --fail --silent http://127.0.0.1:3010/api/pipeline")
          echo "$PIPELINE" | head -c 300
          echo

          echo "$HEALTH" | grep -q '"status"'
          echo "$PIPELINE" | grep -q .

          if echo "$HEALTH" | grep -q "$ARTIFACT"; then
            echo "PROD health includes artifact: $ARTIFACT"
          else
            echo "::error::Health JSON did not include artifact name $ARTIFACT"
            exit 1
          fi

          echo "PROD deploy verified for tag ${{ github.ref_name }}."
