name: Node CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  ci:
    name: Quality & Build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    outputs:
      artifact_name: ${{ steps.version.outputs.artifact_name }}
      app_version: ${{ steps.version.outputs.app_version }}
      git_sha: ${{ steps.version.outputs.git_sha }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Verify SONAR_TOKEN is configured
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is missing."
            exit 1
          fi
          echo "SONAR_TOKEN is present."

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: |
          mkdir -p reports
          npm audit --json > reports/npm-audit.json || true
          npm audit --audit-level=high

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: reports/npm-audit.json
          if-no-files-found: warn

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests with coverage
        run: npm test -- --coverage

      - name: Verify coverage report
        run: |
          set -euo pipefail
          test -f coverage/lcov.info
          echo "coverage/lcov.info found"
          echo "Coverage summary:"
          grep -E "^(LF|LH):" coverage/lcov.info | head -20 || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Wait for SonarCloud analysis and check Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail

          REPORT=".scannerwork/report-task.txt"

          if [ ! -f "$REPORT" ]; then
            echo "::error::SonarCloud report-task.txt was not found."
            exit 1
          fi

          echo "SonarCloud task file:"
          cat "$REPORT"

          CE_TASK_URL=$(grep '^ceTaskUrl=' "$REPORT" | cut -d= -f2-)
          PROJECT_KEY=$(grep '^projectKey=' "$REPORT" | cut -d= -f2-)

          if [ -z "$CE_TASK_URL" ] || [ -z "$PROJECT_KEY" ]; then
            echo "::error::Could not read SonarCloud task URL or project key."
            exit 1
          fi

          echo "Waiting for SonarCloud analysis..."

          ANALYSIS_ID=""

          for i in {1..60}; do
            RESPONSE=$(curl \
              --fail \
              --silent \
              --show-error \
              -u "${SONAR_TOKEN}:" \
              "$CE_TASK_URL")

            STATUS=$(echo "$RESPONSE" | jq -r '.task.status // empty')

            echo "Analysis attempt $i: ${STATUS:-UNKNOWN}"

            if [ "$STATUS" = "SUCCESS" ]; then
              ANALYSIS_ID=$(echo "$RESPONSE" | jq -r '.task.analysisId // empty')
              break
            fi

            if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CANCELED" ]; then
              echo "::error::SonarCloud analysis failed."
              echo "$RESPONSE" | jq .
              exit 1
            fi

            sleep 5
          done

          if [ -z "$ANALYSIS_ID" ]; then
            echo "::error::Timed out waiting for SonarCloud analysis."
            exit 1
          fi

          echo "Analysis completed: $ANALYSIS_ID"

          QUALITY_RESPONSE=$(curl \
            --fail \
            --silent \
            --show-error \
            -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=${PROJECT_KEY}&analysisId=${ANALYSIS_ID}")

          echo "$QUALITY_RESPONSE" | jq .

          QUALITY_STATUS=$(echo "$QUALITY_RESPONSE" | jq -r '.projectStatus.status // empty')

          if [ "$QUALITY_STATUS" != "OK" ]; then
            echo "::error::SonarCloud Quality Gate failed: ${QUALITY_STATUS:-UNKNOWN}"
            exit 1
          fi

          echo "SonarCloud Quality Gate passed."

      - name: Resolve artifact version
        id: version
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./package.json').version")
          SHA="${GITHUB_SHA:0:7}"
          NAME="app-${VERSION}-${SHA}-${GITHUB_RUN_NUMBER}"

          echo "app_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "git_sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${NAME}" >> "$GITHUB_OUTPUT"

          echo "Resolved artifact: $NAME"

      - name: Build application
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          GIT_SHA: ${{ steps.version.outputs.git_sha }}
          BUILD_NUMBER: ${{ github.run_number }}
          ARTIFACT_NAME: ${{ steps.version.outputs.artifact_name }}
        run: npm run build

      - name: Package application
        env:
          ARTIFACT_NAME: ${{ steps.version.outputs.artifact_name }}
        run: npm run package

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: artifacts/${{ steps.version.outputs.artifact_name }}.tar.gz
          retention-days: 14
          if-no-files-found: error

  deploy-dev:
    name: Deploy to DEV
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.ci.outputs.artifact_name }}
          path: artifacts

      - name: Verify artifact
        run: |
          set -euo pipefail

          TARBALL="artifacts/${{ needs.ci.outputs.artifact_name }}.tar.gz"
          test -f "$TARBALL"

          echo "Artifact:"
          ls -lh "$TARBALL"

          echo "Artifact contents:"
          tar -tzf "$TARBALL" | head -30

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail

          test -n "${EC2_SSH_KEY:-}"
          test -n "${EC2_HOST:-}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh-keygen -y -f ~/.ssh/ec2_key > /dev/null
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify EC2 SSH connection
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/ec2_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${EC2_USER}@${EC2_HOST}" \
            "echo 'SSH connection successful'; hostname; whoami"

      - name: Upload artifact to EC2
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          scp \
            -i ~/.ssh/ec2_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "artifacts/${{ needs.ci.outputs.artifact_name }}.tar.gz" \
            "${EC2_USER}@${EC2_HOST}:/tmp/cicd-learning/"

      - name: Deploy artifact on EC2
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/ec2_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${EC2_USER}@${EC2_HOST}" \
            "bash /opt/cicd-learning/deploy.sh '${{ needs.ci.outputs.artifact_name }}'"

      - name: Verify deployed application
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/ec2_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${EC2_USER}@${EC2_HOST}" \
            "curl --fail --silent --show-error http://127.0.0.1:3010/api/health"

  deploy-stage:
    name: Deploy to STAGE
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.ci.outputs.artifact_name }}
          path: artifacts

      - name: Verify artifact
        run: |
          set -euo pipefail

          TARBALL="artifacts/${{ needs.ci.outputs.artifact_name }}.tar.gz"
          test -f "$TARBALL"

          echo "Artifact:"
          ls -lh "$TARBALL"

          echo "Artifact contents:"
          tar -tzf "$TARBALL" | head -30

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail

          test -n "${EC2_SSH_KEY:-}"
          test -n "${EC2_HOST:-}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh-keygen -y -f ~/.ssh/ec2_key > /dev/null
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify EC2 SSH connection
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/ec2_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${EC2_USER}@${EC2_HOST}" \
            "echo 'SSH connection successful'; hostname; whoami"

      - name: Upload artifact to EC2
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          scp \
            -i ~/.ssh/ec2_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "artifacts/${{ needs.ci.outputs.artifact_name }}.tar.gz" \
            "${EC2_USER}@${EC2_HOST}:/tmp/cicd-learning/"

      - name: Deploy artifact on EC2
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/ec2_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${EC2_USER}@${EC2_HOST}" \
            "bash /opt/cicd-learning/deploy.sh '${{ needs.ci.outputs.artifact_name }}'"

      - name: Smoke and integration checks
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail

          ARTIFACT="${{ needs.ci.outputs.artifact_name }}"

          HEALTH=$(ssh \
            -i ~/.ssh/ec2_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${EC2_USER}@${EC2_HOST}" \
            "curl --fail --silent --show-error http://127.0.0.1:3010/api/health")

          echo "$HEALTH"

          PIPELINE=$(ssh \
            -i ~/.ssh/ec2_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${EC2_USER}@${EC2_HOST}" \
            "curl --fail --silent --show-error http://127.0.0.1:3010/api/pipeline")

          echo "$PIPELINE" | head -c 500
          echo

          echo "$HEALTH" | grep -q '"status":"ok"'
          echo "$PIPELINE" | grep -q .

          if ! echo "$HEALTH" | grep -q "$ARTIFACT"; then
            echo "::error::Health JSON did not include expected artifact name: $ARTIFACT"
            exit 1
          fi

          echo "STAGE smoke + integration checks passed."