sonar.projectKey=RaNaJitu_CI-CD-pipeline
sonar.organization=ranajitu

sonar.sources=src,public

sonar.exclusions=node_modules/**,coverage/**,dist/**,scripts/**,reports/**,promotions/**,artifacts/**,test/**

# Browser UI is not unit-tested with Jest; exclude from coverage gate.
sonar.coverage.exclusions=public/**,src/server.js

sonar.tests=test
sonar.test.inclusions=test/**/*.test.js

sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
